# Ruff configuration for the DaranX backend.
# Deterministic rule set (independent of Ruff's shifting defaults) so CI and
# local runs always agree. Start focused; widen over time.

target-version = "py311"
line-length = 100

# Auto-generated / vendored code is not ours to lint.
extend-exclude = [
    "**/migrations/**",
    ".venv",
    "staticfiles",
    "manage.py",
]

[lint]
# E/W: pycodestyle · F: pyflakes · I: import sorting · UP: pyupgrade
# B: bugbear (real bug patterns) · C4: comprehensions · DJ: Django-specific
select = ["E", "W", "F", "I", "UP", "B", "C4", "DJ"]
ignore = [
    "E501",   # line length — enforced softly; don't block on long strings/URLs
    "B008",   # function call in default arg — common/intentional in DRF/Django
]

[lint.per-file-ignores]
# Tests favour local imports inside test bodies and reuse fixtures freely.
"tests/**" = ["F401", "E402"]

[lint.isort]
known-first-party = ["apps", "daranx"]
