# DaranX backend — one-command deployment for a single VPS.
#
#   1) cp backend/.env.production.example backend/.env   # then edit it
#   2) docker compose up -d --build
#   3) open http://SERVER_IP:8000/health   (put nginx/Caddy in front for TLS)
#
# The `web` service migrates + seeds itself on first boot (see entrypoint.sh).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daranx
      POSTGRES_USER: daranx
      # Must match the password inside DATABASE_URL in backend/.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daranx -d daranx"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Releases expired 48h soft reservations (Section 5). Runs every 15 minutes.
  # Uses the same image; no web port. Skips the seed step.
  reservations:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SEED_ON_START: "false"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python manage.py release_reservations || true
          sleep 900
        done

volumes:
  db_data:
