# Pre-commit hooks — run lint locally before each commit so problems are caught
# before CI. Install once:
#
#   pip install pre-commit        # (already in backend/requirements-dev.txt)
#   pre-commit install
#
# Ruff auto-discovers backend/ruff.toml for files under backend/.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
