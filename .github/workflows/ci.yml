name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + migrations + tests (PostgreSQL)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: daranx
          POSTGRES_USER: daranx
          POSTGRES_PASSWORD: daranx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daranx -d daranx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Exercise the same engine we deploy on — SQLite would skip row locking.
      DATABASE_URL: postgresql+psycopg://daranx:daranx@localhost:5432/daranx
      DEBUG: "true"
      SECRET_KEY: ci-secret-key-not-used-in-production-000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest + coverage)
        run: pytest -q --cov=apps --cov-report=term-missing
