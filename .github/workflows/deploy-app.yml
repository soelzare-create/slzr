# استقرار خودکار نرم‌افزار داران ایکس (بک‌اند Django + فرانت React) روی هاست
# cPanel، از طریق FTP — بدون نیاز به SSH.
#
# ── چگونه کار می‌کند ───────────────────────────────────────────────────────
# هاست cPanel با «Setup Python App» (Phusion Passenger) یک اپ پایتون اجرا
# می‌کند. این Workflow با هر push به main:
#   ۱) تست‌ها و لینت بک‌اند را اجرا می‌کند (گیت ایمنی — خراب بود، دیپلوی نمی‌شود).
#   ۲) فرانت را می‌سازد (npm run build) و داخل backend/frontend_dist می‌گذارد؛
#      Django همان را (با WhiteNoise) کنار API سرو می‌کند — یک اپ، یک آدرس.
#   ۳) کل پوشهٔ backend/ را با FTP روی ریشهٔ اپ پایتون در هاست آپلود می‌کند.
#   ۴) فایل tmp/restart.txt را تازه می‌کند — همین باعث می‌شود Passenger پردازهٔ
#      اپ را در اولین درخواست بعدی دوباره بالا بیاورد؛ passenger_wsgi.py هم در
#      همان بوت migrate/seed/collectstatic را (idempotent) اجرا می‌کند — چون
#      این هاست SSH ندارد تا این دستورها را دستی بزنیم.
#
# ── راه‌اندازی یک‌بار (پیش از اولین اجرای این Workflow) ──────────────────────
# راهنمای کامل در DEPLOY.md (بخش «cPanel اشتراکی بدون SSH»). خلاصه:
#   ۱. در cPanel → Setup Python App: یک اپ با دامنهٔ app.daranx.com بسازید
#      (پایتون ۳.۱۱ یا بالاتر، Startup file: passenger_wsgi.py،
#      Entry point: application).
#   ۲. یک حساب FTP مجزا بسازید که Directory آن دقیقاً همان «Application
#      root»ـی باشد که cPanel برای اپ ساخت.
#   ۳. سه Secret زیر را در GitHub (Settings → Secrets and variables →
#      Actions) بسازید: FTP_SERVER، FTP_USERNAME، FTP_PASSWORD
#      (مقادیر همان حساب FTP مرحلهٔ ۲).
#   ۴. فایل .env تولید (مقادیر SECRET_KEY و غیره — DEPLOY.md دقیق می‌گوید)
#      را یک‌بار با File Manager داخل همان پوشه آپلود کنید — این فایل هرگز
#      از طریق این Workflow آپلود/حذف نمی‌شود.
#   ۵. در صفحهٔ Setup Python App، روی «Run Pip Install» بزنید (و هر وقت
#      requirements.txt عوض شد، دوباره).
# ─────────────────────────────────────────────────────────────────────────────

name: deploy-app-to-cpanel

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (گیت ایمنی قبل از دیپلوی)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # بدون DATABASE_URL یعنی SQLite — همان موتوری که این دیپلوی (بدون
      # پستگرس روی این هاست) واقعاً با آن اجرا می‌شود.
      DEBUG: "true"
      SECRET_KEY: ci-secret-key-not-used-in-production-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  deploy:
    name: build + FTP deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into the backend (served by WhiteNoise)
        run: |
          rm -rf backend/frontend_dist
          cp -r frontend/dist backend/frontend_dist

      - name: Touch the Passenger restart signal
        run: |
          mkdir -p backend/tmp
          date > backend/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21

          # این حساب FTP باید دقیقاً روی «Application root» اپ پایتون در
          # cPanel ساخته شده باشد (نه public_html)؛ آن‌وقت ریشهٔ همان FTP
          # دقیقاً معادل backend/ است.
          local-dir: backend/
          server-dir: ./

          # فقط فایل‌های لازم برای اجرا آپلود می‌شوند. .env و پایگاه‌دادهٔ
          # SQLite هرگز اینجا نیستند، پس هرگز با این دیپلوی بازنویسی/حذف
          # نمی‌شوند.
          exclude: |
            **/.git*
            **/.git*/**
            .venv/**
            **/__pycache__/**
            **/*.pyc
            .pytest_cache/**
            .ruff_cache/**
            tests/**
            staticfiles/**
            *.db
            *.sqlite3
            .env
            .deployed
